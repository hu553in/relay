name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-bun.yml@main

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: ubuntu-22.04
            args: --linux --x64
            path: release/**/*.AppImage
          - target: mac-arm64
            platform: macos-latest
            args: --mac --arm64
            path: release/**/*.dmg
          - target: mac-x64
            platform: macos-latest
            args: --mac --x64
            path: release/**/*.dmg
          - target: win-x64
            platform: windows-latest
            args: --win --x64
            path: release/**/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run build:app
      - run: bun run build:package ${{ matrix.args }} --publish never
      - uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.path }}
      - uses: actions/upload-artifact@v7
        with:
          name: relay-build-${{ matrix.target }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  release-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: relay-build
          pattern: relay-build-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            relay-build/**/*
